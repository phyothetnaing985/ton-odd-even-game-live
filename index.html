<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>GOLDEN GAME | Production v8</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #0b0e11; --card: #161b22; --accent: #f3ba2f; --green: #00c087; --text: #eaecef; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; padding-bottom: 90px; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: var(--card); border-bottom: 1px solid #2b3139; position: sticky; top: 0; z-index: 1000; }
        .screen { display: none; padding: 15px; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .game-img { width: 100%; max-width: 380px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #2b3139; }
        .val { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
        .label { font-size: 0.7rem; color: #848e9c; text-transform: uppercase; letter-spacing: 1px; }
        .slider { width: 100%; max-width: 400px; height: 12px; margin: 30px 0; -webkit-appearance: none; background: #2b3139; border-radius: 6px; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 4px solid #fff; box-shadow: 0 0 15px rgba(243,186,47,0.4); }
        .side-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; margin-bottom: 25px; }
        .btn-side { padding: 18px; border-radius: 12px; border: 2px solid #2b3139; background: #1c2128; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-side.selected { border-color: var(--accent); background: rgba(243,186,47,0.1); color: var(--accent); }
        .btn-main { width: 100%; max-width: 400px; padding: 20px; border-radius: 14px; background: var(--green); color: white; font-weight: 800; border: none; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0,192,135,0.3); }
        .btn-main:disabled { opacity: 0.5; filter: grayscale(1); }
        .footer { position: fixed; bottom: 0; width: 100%; height: 80px; background: var(--card); display: flex; border-top: 1px solid #2b3139; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.8rem; color: #848e9c; cursor: pointer; }
        .nav-item.active-nav { color: var(--accent); }
        .status-msg { margin-top: 15px; font-size: 0.9rem; color: var(--accent); font-weight: 500; display: none; }
    </style>
</head>
<body>

<div class="header">
    <div id="ton-connect-btn"></div>
    <div style="font-weight: 900; color: var(--accent);">GOLDEN v8</div>
</div>

<div id="lobby-screen" class="screen active">
    <img src="https://i.ibb.co/JjLp1zJ8/file-00000000740871fa81847d4e88a5158b.png" class="game-img">
    <button class="btn-main" onclick="showScreen('play-screen')">START PLAYING</button>
</div>

<div id="play-screen" class="screen">
    <img src="https://i.ibb.co/qYnXY1CW/1772808401788.png" class="game-img" style="max-width: 150px; margin-bottom: 10px;">
    
    <div class="stats-grid">
        <div class="stat-box"><span class="label">Bet</span><br><span class="val" id="ui-bet">0.10</span></div>
        <div class="stat-box"><span class="label">Win</span><br><span class="val" id="ui-win" style="color:var(--green)">0.18</span></div>
    </div>
    
    <input type="range" min="0.1" max="1.0" step="0.05" value="0.1" class="slider" id="betSlider">
    
    <div class="side-picker">
        <button id="low-btn" class="btn-side selected" onclick="setSide(true)">LOW (1-49)</button>
        <button id="high-btn" class="btn-side" onclick="setSide(false)">HIGH (50-98)</button>
    </div>
    
    <button class="btn-main" id="bet-btn" onclick="placeBet()">PLACE BET NOW</button>
    <div id="status-box" class="status-msg"></div>
</div>

<div id="invite-screen" class="screen">
    <div class="stat-box" style="width:100%; max-width:400px; padding: 30px 20px;">
        <i class="fas fa-users" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
        <h2>Referral Program</h2>
        <p style="color:#848e9c; margin-bottom: 25px;">Earn 5% instantly from your friends' wins!</p>
        
        <div id="ref-url" style="background:#000; padding:15px; border-radius:10px; font-size:0.8rem; border:1px dashed #444; margin-bottom: 20px; color: var(--accent);">Connect Wallet first</div>
        
        <button class="btn-main" onclick="copyInvite()" style="background:var(--accent); color:#000;">COPY LINK</button>
        <button class="btn-side" onclick="withdrawRef()" style="width:100%; margin-top: 15px; border-color: var(--accent);">WITHDRAW REWARDS</button>
    </div>
</div>

<div class="footer">
    <div class="nav-item active-nav" id="nav-lobby" onclick="showScreen('lobby-screen')"><i class="fas fa-home"></i><span>Lobby</span></div>
    <div class="nav-item" id="nav-invite" onclick="showScreen('invite-screen')"><i class="fas fa-gift"></i><span>Invite</span></div>
</div>

<script>
    const CONTRACT_ADDR = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";
    const MANIFEST_URL = "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json";
    let tonConnectUI;
    let isLow = true;

    async function init() {
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: MANIFEST_URL,
            buttonRootId: 'ton-connect-btn'
        });

        document.getElementById('betSlider').oninput = function() {
            const val = parseFloat(this.value);
            document.getElementById('ui-bet').innerText = val.toFixed(2);
            document.getElementById('ui-win').innerText = (val * 1.85).toFixed(2);
        };

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                const addr = new TonWeb.utils.Address(wallet.account.address).toString(true, true, true);
                document.getElementById('ref-url').innerText = window.location.origin + window.location.pathname + "?ref=" + addr;
            }
        });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-lobby').classList.toggle('active-nav', id !== 'invite-screen');
        document.getElementById('nav-invite').classList.toggle('active-nav', id === 'invite-screen');
    }

    function setSide(low) {
        isLow = low;
        document.getElementById('low-btn').classList.toggle('selected', low);
        document.getElementById('high-btn').classList.toggle('selected', !low);
    }

    async function placeBet() {
        if (!tonConnectUI.connected) { alert("Please Connect Wallet!"); return; }
        
        const btn = document.getElementById('bet-btn');
        const status = document.getElementById('status-box');
        const uiVal = parseFloat(document.getElementById('ui-bet').innerText);
        
        btn.disabled = true;
        status.style.display = "block";
        status.innerText = "Check your wallet...";

        try {
            // Tact-Friendly Amount Logic
            let betVal = uiVal >= 1.0 ? 0.98 : uiVal;
            const nanoAmount = TonWeb.utils.toNano((betVal + 0.02).toFixed(2)).toString();

            // CRITICAL FIX: Tact Maybe<Address> Manual Serialization
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32); // Opcode
            cell.bits.writeBit(isLow);           // sideLow: Bool

            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');

            if (ref && TonWeb.utils.Address.isValid(ref)) {
                cell.bits.writeBit(1); // Maybe Flag: true
                cell.bits.writeAddress(new TonWeb.utils.Address(ref));
            } else {
                cell.bits.writeBit(0); // Maybe Flag: false
            }

            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc());

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: CONTRACT_ADDR,
                    amount: nanoAmount,
                    payload: payload,
                    bounce: true // Set to true to catch errors
                }]
            });
            status.innerText = "Transaction Sent! Good Luck!";
        } catch (e) {
            status.innerText = "Failed or Cancelled.";
        } finally {
            setTimeout(() => { btn.disabled = false; status.style.display="none"; }, 4000);
        }
    }

    async function withdrawRef() {
        if (!tonConnectUI.connected) return;
        try {
            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: CONTRACT_ADDR,
                    amount: TonWeb.utils.toNano("0.05").toString(),
                    payload: "te6cckEBAQEADgAAGFdpdGhkcmF3UmVme967Bw==", // "WithdrawRef"
                    bounce: false
                }]
            });
            alert("Request Sent!");
        } catch (e) { console.error(e); }
    }

    function copyInvite() {
        const link = document.getElementById('ref-url').innerText;
        if (link.includes("Connect")) return;
        navigator.clipboard.writeText(link);
        alert("Link Copied!");
    }

    window.onload = init;
</script>
</body>
</html>
