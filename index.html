<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN GAME MASTER V3</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --gold:#f1c40f; --dark:#0f172a; --card:#1e293b; --green:#2ecc71; --blue:#3498db; --text:#94a3b8; }
        body { background: radial-gradient(circle, #1e293b, #0f172a); color: white; text-align: center; font-family: 'Segoe UI', Arial; margin: 0; padding: 20px; }
        .container { max-width: 420px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(241,196,15,0.1); }
        .winbox { background: rgba(0,0,0,0.3); border: 2px solid var(--gold); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .winbox b { font-size: 28px; color: var(--gold); }
        .stat-row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: var(--text); }
        input { width: 90%; padding: 15px; margin: 15px 0; border-radius: 12px; border: none; background: #0f172a; color: var(--gold); text-align: center; font-size: 20px; font-weight: bold; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        button { cursor: pointer; border: none; font-weight: bold; transition: 0.3s; border-radius: 12px; }
        .side-btn { padding: 15px; background: #334155; color: var(--text); }
        .side-btn.active { background: var(--gold); color: black; box-shadow: 0 0 20px rgba(241,196,15,0.4); }
        .main-btn { width: 100%; padding: 18px; margin-top: 10px; font-size: 16px; color: white; }
        .green { background: var(--green); }
        .blue { background: var(--blue); }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color:var(--gold); margin-bottom:10px;">🎰 GOLDEN GAME PRO</h1>
    <div id="wallet" style="margin-bottom:20px;"></div>

    <div class="card">
        <div class="winbox">
            <span style="font-size:14px; color:var(--text)">PENDING WINNINGS</span><br>
            <b id="pending">0.000</b> <small style="color:var(--gold)">TON</small>
            <div class="stat-row">
                <span>Referral: <span id="ref" style="color:white">0.000</span> TON</span>
            </div>
        </div>

        <label style="font-size:12px; color:var(--text)">BET AMOUNT (0.1 - 1.0 TON)</label><br>
        <input type="number" id="amount" value="0.2" step="0.1">

        <div class="btn-grid">
            <button id="lowBtn" class="side-btn active" onclick="setSide(true)">LOW (1-49)</button>
            <button id="highBtn" class="side-btn" onclick="setSide(false)">HIGH (50-98)</button>
        </div>

        <button class="main-btn green" onclick="placeBet()">🎯 PLACE BET</button>
        <button class="main-btn blue" onclick="claimWin()">💸 CLAIM WINNINGS</button>
    </div>
</div>

<script>
    const CONTRACT = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";
    const tonweb = new TonWeb(new TonWeb.HttpProvider("https://toncenter.com/api/v2/jsonRPC"));
    
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
        buttonRootId: "wallet"
    });

    let userAddress = null;
    let isLow = true;

    function setSide(side) {
        isLow = side;
        document.getElementById('lowBtn').className = side ? 'side-btn active' : 'side-btn';
        document.getElementById('highBtn').className = side ? 'side-btn' : 'side-btn active';
    }

    tonConnectUI.onStatusChange(wallet => {
        if (wallet) {
            userAddress = wallet.account.address;
            loadData();
        }
    });

    // 🔥 အဓိကပြင်ဆင်လိုက်သော Getter Function (Pending ကို မှန်စေမည့်အပိုင်း)
    async function fetchFromContract(method) {
        if (!userAddress) return "0";
        try {
            const addr = new TonWeb.utils.Address(userAddress);
            const cell = new TonWeb.boc.Cell();
            
            // CGPT အကြံပြုထားသည့်အတိုင်း Raw Address Slice တည်ဆောက်ခြင်း
            cell.bits.writeInt(addr.wc, 8);
            cell.bits.writeBytes(addr.hashPart);

            const boc = await cell.toBoc(false);
            const sliceB64 = TonWeb.utils.bytesToBase64(boc);

            const res = await tonweb.provider.call2(CONTRACT, method, [["tvm.Slice", sliceB64]]);
            
            if (!res || !res.stack || res.stack.length === 0) return "0";
            
            // BigInt သုံးပြီး တိကျစွာပြောင်းလဲခြင်း
            const rawVal = res.stack[0][1];
            const bigIntVal = BigInt(rawVal);
            return TonWeb.utils.fromNano(bigIntVal.toString());
        } catch (e) {
            console.error(method + " Error:", e);
            return "0";
        }
    }

    async function loadData() {
        const pWin = await fetchFromContract("pendingWin");
        const rBal = await fetchFromContract("referralBalance");
        document.getElementById('pending').innerText = parseFloat(pWin).toFixed(4);
        document.getElementById('ref').innerText = parseFloat(rBal).toFixed(4);
    }

    async function placeBet() {
        try {
            const val = document.getElementById('amount').value;
            const nanoAmount = TonWeb.utils.toNano(val);
            const totalAmount = nanoAmount.add(TonWeb.utils.toNano("0.05"));

            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32);
            cell.bits.writeBit(isLow);
            cell.bits.writeAddress(null); 

            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [{ address: CONTRACT, amount: totalAmount.toString(), payload: payload }]
            });
            setTimeout(loadData, 5000);
        } catch (e) { alert("Error: " + e.message); }
    }

    async function claimWin() {
        try {
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0, 32); // Opcode 0 for comment
            cell.bits.writeString("Claim");
            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: CONTRACT, amount: TonWeb.utils.toNano("0.05").toString(), payload: payload }]
            });
            setTimeout(loadData, 6000);
        } catch (e) { alert(e.message); }
    }

    setInterval(loadData, 8000);
</script>
</body>
</html>
