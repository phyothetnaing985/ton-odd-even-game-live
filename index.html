<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEN ODD-EVEN | TON</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://bundle.run/tonweb@0.0.62"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #f0f6fc; --accent: #238636; --yellow: #e3b341; --blue: #1f6feb; }
        .light-mode { --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --accent: #2da44e; --yellow: #9a6700; --blue: #0969da; }
        
        body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; margin: 0; padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; padding: 15px; align-items: center; background: var(--card); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        /* Fixed Wallet Button Container */
        #ton-connect-btn { min-width: 150px; }

        .screen { display: none; padding: 15px; }
        .active { display: block; }

        .img-container { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .img-container img { width: 100%; display: block; }

        .card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; text-align: center; }

        /* Real-time Display */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .val { display: block; font-size: 1.2rem; font-weight: 800; color: var(--yellow); }

        /* Input & Slider */
        .slider-box { margin: 20px 0; }
        .slider { width: 100%; height: 8px; border-radius: 5px; background: #30363d; outline: none; appearance: none; -webkit-appearance: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 25px; height: 25px; background: var(--blue); border-radius: 50%; cursor: pointer; border: 3px solid #fff; }

        /* Choices (LOW/HIGH) */
        .choice-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-choice { flex: 1; padding: 15px; border-radius: 10px; background: #21262d; border: 2px solid transparent; color: white; font-weight: bold; cursor: pointer; }
        .btn-choice.selected { border-color: var(--blue); background: rgba(31, 111, 235, 0.1); color: var(--blue); }

        .btn-bet { background: linear-gradient(180deg, #f0c050 0%, #d4a017 100%); color: #000; border: none; border-radius: 12px; padding: 18px; width: 100%; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
        .btn-bet:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { flex: 1; text-align: center; color: #8b949e; text-decoration: none; font-size: 12px; }
        .nav-item.active { color: var(--blue); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body class="dark-mode">

<div class="header">
    <div id="ton-connect-btn"></div>
    <div onclick="toggleTheme()" style="cursor: pointer; font-size: 20px;"><i class="fas fa-moon" id="theme-icon"></i></div>
</div>

<div id="lobby" class="screen active">
    <div class="img-container"><img src="https://i.postimg.cc/XJfvQK5S/IMG-20260115-210549.png"></div>
    <div class="card">
        <h1 style="margin:0; color:var(--yellow);">GOLDEN ODD-EVEN</h1>
        <p style="color:#8b949e;">Provably Fair & Instant Payouts</p>
        <button class="btn-bet" onclick="nav('play')" style="margin-top:10px;">PLAY NOW <i class="fas fa-play"></i></button>
    </div>
</div>

<div id="play" class="screen">
    <div class="img-container"><img src="https://i.postimg.cc/8zfNZBQP/IMG-20260115-210803.png"></div>
    <div class="card">
        <div class="stat-grid">
            <div class="stat-box"><small>Bet Amount</small><span class="val"><span id="betVal">0.1</span> TON</span></div>
            <div class="stat-box"><small>Win Payout</small><span class="val" style="color:var(--accent);"><span id="winVal">0.185</span> TON</span></div>
        </div>

        <div class="slider-box">
            <input type="range" min="0.1" max="1.0" step="0.1" value="0.1" class="slider" id="betSlider">
        </div>

        <div class="choice-row">
            <button class="btn-choice selected" id="lowBtn" onclick="setSide(true)">LOW (1-49)</button>
            <button class="btn-choice" id="highBtn" onclick="setSide(false)">HIGH (50-98)</button>
        </div>

        <button class="btn-bet" id="placeBetBtn" onclick="handleBet()">PLACE BET NOW</button>
        <p id="statusTxt" style="font-size:12px; margin-top:15px; color:#8b949e; min-height:15px;"></p>
    </div>
</div>

<div id="invite" class="screen">
    <div class="card" style="background:var(--blue); color:white;">
        <h3>Earn 5% Commission</h3>
        <p>From your referrals' <b>WINNING</b> bets instantly.</p>
    </div>
    <div class="card">
        <small>Referral Link</small>
        <div id="refLink" style="padding:10px; background:rgba(0,0,0,0.2); border-radius:8px; font-size:11px; margin:10px 0; word-break:break-all;">Connect wallet to see link</div>
        <button class="btn-bet" onclick="copyRef()" style="background:#30363d; color:white; font-size:14px; padding:12px;">COPY LINK</button>
    </div>
</div>

<div class="nav-bar">
    <a href="#" class="nav-item active" id="nav-lobby" onclick="nav('lobby')"><i class="fas fa-th-large"></i><br>Lobby</a>
    <a href="#" class="nav-item" id="nav-invite" onclick="nav('invite')"><i class="fas fa-user-plus"></i><br>Invite</a>
</div>

<script>
    const CONTRACT = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";
    const tonConnectUI = new TONConnectUI.TonConnectUI({
        manifestUrl: 'https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-btn'
    });

    let sideLow = true;
    const betSlider = document.getElementById('betSlider');

    // 1. Navigation Fix
    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id !== 'play') document.getElementById('nav-'+id).classList.add('active');
    }

    // 2. Real-time Calculation Fix
    betSlider.oninput = function() {
        const val = parseFloat(this.value);
        document.getElementById('betVal').innerText = val.toFixed(1);
        document.getElementById('winVal').innerText = (val * 1.85).toFixed(3);
    };

    // 3. Choice Selection Fix (LOW/HIGH Swap)
    function setSide(isLow) {
        sideLow = isLow;
        document.getElementById('lowBtn').classList.toggle('selected', isLow);
        document.getElementById('highBtn').classList.toggle('selected', !isLow);
    }

    // 4. Critical Handle Bet (Implementing 14 Safeguards)
    async function handleBet() {
        if (!tonConnectUI.connected) return alert("Please connect Tonkeeper first!");

        const btn = document.getElementById('placeBetBtn');
        const status = document.getElementById('statusTxt');
        const betAmt = betSlider.value;

        // Rule 4: Disable Button to prevent double tx
        btn.disabled = true;
        status.innerText = "Confirm in Tonkeeper...";

        try {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');

            // Rule 1: Exact Serialization (Tact Opcode 0xAAAABBBB)
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32); 
            cell.bits.writeBit(sideLow);         

            // Rule 11: Optional Address Trap
            if (ref && TonWeb.utils.Address.isValid(ref)) {
                cell.bits.writeBit(true);
                cell.bits.writeAddress(new TonWeb.utils.Address(ref));
            } else {
                cell.bits.writeBit(false);
            }

            const boc = TonWeb.utils.bytesToBase64(await cell.toBoc());
            
            // Rule 12: toNano Precision
            const nanoAmt = TonWeb.utils.toNano(betAmt).toString();

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: CONTRACT,
                    amount: nanoAmt, // Rule 2: Pure bet amount
                    payload: boc,
                    bounce: false // Rule 3
                }]
            };

            await tonConnectUI.sendTransaction(tx);
            status.innerText = "Bet Sent! Waiting for dice result...";
            status.style.color = "#238636";
        } catch (e) {
            status.innerText = "Error: " + (e.message || "Transaction Cancelled");
            status.style.color = "#f85149";
            btn.disabled = false;
        }
    }

    // Theme Toggle
    function toggleTheme() {
        const isDark = document.body.classList.toggle('light-mode');
        document.getElementById('theme-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
    }

    // Referral Fix
    tonConnectUI.onStatusChange(wallet => {
        if (wallet) {
            const addr = new TonWeb.utils.Address(wallet.account.address).toString(true, true, true);
            document.getElementById('refLink').innerText = window.location.origin + window.location.pathname + "?ref=" + addr;
        }
    });

    function copyRef() {
        const text = document.getElementById('refLink').innerText;
        if(text.includes("Connect")) return;
        navigator.clipboard.writeText(text);
        alert("Referral Link Copied!");
    }
</script>
</body>
</html>
