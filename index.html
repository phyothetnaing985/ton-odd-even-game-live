<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOLDEN GAME FINAL</title>

<script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>

<style>
:root{
 --gold:#f1c40f;
 --dark:#0f172a;
 --card:#1e293b;
 --green:#2ecc71;
 --blue:#3498db;
}

body{
 background: radial-gradient(circle,#1e293b,#0f172a);
 color:white;
 font-family:Arial;
 text-align:center;
}

.container{ max-width:420px; margin:auto; padding:20px; }

.card{
 background:var(--card);
 padding:20px;
 border-radius:20px;
 border:1px solid rgba(241,196,15,0.2);
}

.winbox{
 border:1px solid var(--gold);
 padding:15px;
 border-radius:12px;
 margin-bottom:10px;
}

button{
 width:100%;
 padding:14px;
 margin-top:10px;
 border:none;
 border-radius:10px;
 font-weight:bold;
}

.low.active,.high.active{
 background:var(--gold);
 color:black;
}

.low,.high{
 background:#334155;
 color:#94a3b8;
}

.green{ background:var(--green); }
.blue{ background:var(--blue); }

input{
 width:100%;
 padding:12px;
 margin-top:10px;
 border-radius:8px;
 border:none;
}
</style>
</head>

<body>

<div class="container">

<h2>🎰 GOLDEN GAME</h2>

<div id="wallet"></div>

<div class="card">

<div class="winbox">
Pending: <b id="pending">0</b> TON<br>
Referral: <b id="ref">0</b> TON
</div>

<input id="amount" value="0.2">

<button id="lowBtn" class="low active">LOW</button>
<button id="highBtn" class="high">HIGH</button>

<button class="green" onclick="placeBet()">BET</button>
<button class="blue" onclick="claimWin()">CLAIM</button>

</div>
</div>

<script>
const CONTRACT = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";

const tonweb = new TonWeb(
 new TonWeb.HttpProvider("https://toncenter.com/api/v2/jsonRPC")
);

const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
 manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
 buttonRootId: "wallet"
});

let userAddress = null;
let sideLow = true;

/* UI */
lowBtn.onclick = ()=>{
 sideLow = true;
 lowBtn.classList.add("active");
 highBtn.classList.remove("active");
};

highBtn.onclick = ()=>{
 sideLow = false;
 highBtn.classList.add("active");
 lowBtn.classList.remove("active");
};

/* CONNECT */
tonConnectUI.onStatusChange(wallet=>{
 if(wallet){
  userAddress = wallet.account.address;
  console.log("Connected:", userAddress);
  loadAll();
 }
});

/* ✅ PERFECT GETTER */
async function callGetter(method){
 try{
  const addr = new TonWeb.utils.Address(userAddress);

  // ✅ EXACT ADDRESS SERIALIZATION
  const cell = new TonWeb.boc.Cell();
  cell.bits.writeAddress(addr);

  const boc = await cell.toBoc(false);
  const slice = TonWeb.utils.bytesToBase64(boc);

  const res = await tonweb.provider.call2(
    CONTRACT,
    method,
    [["tvm.Slice", slice]]
  );

  console.log("RAW:", res);

  // ✅ SAFE PARSE
  let val = "0";

  if(res.stack && res.stack.length > 0){
    if(res.stack[0][1]){
        val = res.stack[0][1];
    }
  }

  return TonWeb.utils.fromNano(val);

 }catch(e){
  console.error("GETTER ERROR:", e);
  return "0";
 }
}

/* LOAD */
async function loadAll(){
 if(!userAddress) return;

 const pending = await callGetter("pendingWin");
 const ref = await callGetter("referralBalance");

 document.getElementById("pending").innerText = pending;
 document.getElementById("ref").innerText = ref;
}

/* BET */
async function placeBet(){
 try{
  const bet = document.getElementById("amount").value;

  const amount = TonWeb.utils.toNano(bet)
    .add(TonWeb.utils.toNano("0.05"));

  const cell = new TonWeb.boc.Cell();
  cell.bits.writeUint(0xAAAABBBB,32);
  cell.bits.writeBit(sideLow);
  cell.bits.writeAddress(null);

  const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

  await tonConnectUI.sendTransaction({
    validUntil: Math.floor(Date.now()/1000)+360,
    messages:[{
      address: CONTRACT,
      amount: amount.toString(),
      payload
    }]
  });

  setTimeout(loadAll,5000);

 }catch(e){
  alert(e.message);
 }
}

/* CLAIM */
async function claimWin(){
 try{
  const cell = new TonWeb.boc.Cell();
  cell.bits.writeUint(0,32);
  cell.bits.writeString("Claim");

  const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

  await tonConnectUI.sendTransaction({
    validUntil: Math.floor(Date.now()/1000)+300,
    messages:[{
      address: CONTRACT,
      amount: TonWeb.utils.toNano("0.05").toString(),
      payload
    }]
  });

  document.getElementById("pending").innerText="0";

  setTimeout(loadAll,6000);

 }catch(e){
  alert(e.message);
 }
}

/* AUTO REFRESH */
setInterval(loadAll,5000);

</script>

</body>
</html>
