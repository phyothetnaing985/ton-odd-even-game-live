<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN GAME - DEBUG MASTER</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --gold:#f1c40f; --dark:#0f172a; --card:#1e293b; --green:#2ecc71; --blue:#3498db; }
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 420px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid rgba(241,196,15,0.3); }
        .winbox { background: rgba(0,0,0,0.2); border: 2px solid var(--gold); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        b { font-size: 24px; color: var(--gold); }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; text-align: center; font-size: 18px; }
        button { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .low.active, .high.active { background: var(--gold); color: black; }
        .low, .high { background: #334155; color: #94a3b8; }
        .green { background: var(--green); color: white; }
        .blue { background: var(--blue); color: white; }
        #debug-log { font-size: 10px; color: #64748b; margin-top: 20px; text-align: left; background: #000; padding: 10px; border-radius: 5px; overflow-x: auto; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎰 GOLDEN GAME V5</h2>
    <div id="wallet" style="margin-bottom: 20px;"></div>

    <div class="card">
        <div class="winbox">
            PENDING: <b id="pending">0.00</b> TON<br>
            <small>Referral: <span id="ref">0.00</span> TON</small>
        </div>

        <input type="number" id="amount" value="0.2" step="0.1">

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="lowBtn" class="low active" onclick="setSide(true)">LOW</button>
            <button id="highBtn" class="high" onclick="setSide(false)">HIGH</button>
        </div>

        <button class="green" onclick="placeBet()">PLACE BET</button>
        <button class="blue" onclick="claimWin()">CLAIM WINNINGS</button>
        
        <p style="font-size: 12px; color: #94a3b8; cursor: pointer;" onclick="document.getElementById('debug-log').style.display='block'">Show Debug Log</p>
    </div>

    <pre id="debug-log"></pre>
</div>

<script>
    const CONTRACT = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";
    const PROVIDER = "https://toncenter.com/api/v2/jsonRPC";
    const tonweb = new TonWeb();

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
        buttonRootId: "wallet"
    });

    let userAddress = null;
    let isSideLow = true;

    function setSide(s) {
        isSideLow = s;
        document.getElementById('lowBtn').className = s ? 'low active' : 'low';
        document.getElementById('highBtn').className = s ? 'high' : 'high active';
    }

    tonConnectUI.onStatusChange(w => {
        if (w) {
            userAddress = w.account.address;
            loadData();
        }
    });

    // အမတ်ကြီး၏ အထူးစီရင်ထားသော တိုက်ရိုက် RPC ခေါ်ဆိုမှု
    async function callGetter(method) {
        if (!userAddress) return "0";
        try {
            const addr = new TonWeb.utils.Address(userAddress);
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeAddress(addr);
            const boc = await cell.toBoc(false);
            const b64 = TonWeb.utils.bytesToBase64(boc);

            const response = await fetch(PROVIDER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "id": 1,
                    "jsonrpc": "2.0",
                    "method": "runGetMethod",
                    "params": { "address": CONTRACT, "method": method, "stack": [["tvm.Slice", b64]] }
                })
            });

            const data = await response.json();
            document.getElementById('debug-log').innerText += `\n[${method}] Response: ` + JSON.stringify(data);

            if (data.result && data.result.stack && data.result.stack.length > 0) {
                let hexVal = data.result.stack[0][1];
                return TonWeb.utils.fromNano(BigInt(hexVal).toString());
            }
            return "0";
        } catch (e) {
            console.error(e);
            return "0";
        }
    }

    async function loadData() {
        const p = await callGetter("pendingWin");
        const r = await callGetter("referralBalance");
        document.getElementById('pending').innerText = parseFloat(p).toFixed(3);
        document.getElementById('ref').innerText = parseFloat(r).toFixed(3);
    }

    async function placeBet() {
        try {
            const val = document.getElementById('amount').value;
            const total = TonWeb.utils.toNano(val).add(TonWeb.utils.toNano("0.05"));
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32);
            cell.bits.writeBit(isSideLow);
            cell.bits.writeAddress(null);
            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: CONTRACT, amount: total.toString(), payload: payload }]
            });
            setTimeout(loadData, 5000);
        } catch (e) { alert(e.message); }
    }

    async function claimWin() {
        try {
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0, 32);
            cell.bits.writeString("Claim");
            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: CONTRACT, amount: TonWeb.utils.toNano("0.05").toString(), payload: payload }]
            });
            setTimeout(loadData, 6000);
        } catch (e) { alert(e.message); }
    }

    setInterval(loadData, 10000);
</script>

</body>
</html>
