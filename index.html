<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Game Pro V1.5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tonweb/0.0.66/tonweb.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.2/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 40px; }
        .card { background: #1e293b; margin: 15px auto; padding: 20px; border-radius: 20px; max-width: 380px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .btn { padding: 15px; margin: 8px; border: none; border-radius: 12px; font-weight: bold; width: 90%; font-size: 16px; cursor: pointer; }
        .side-btn { width: 44%; background: #334155; color: #94a3b8; }
        .selected { background: #475569; color: white; border: 2px solid #fbbf24; }
        .place-bet-btn { background: #22c55e; color: white; font-size: 18px; }
        input { width: 80%; padding: 15px; border-radius: 10px; border: none; background: #0f172a; color: white; font-size: 18px; margin-bottom: 10px; }
        #ton-connect { margin: 20px auto; min-height: 40px; }
    </style>
</head>
<body>

    <header style="background: #020617; padding: 15px; font-size: 22px; font-weight: bold;">🎲 GOLDEN GAME V1.5</header>
    
    <div id="ton-connect"></div>

    <div class="card">
        <h3>Bet Amount (TON)</h3>
        <input id="betAmount" type="number" value="0.2" step="0.1">
        
        <h3>Choose Your Side</h3>
        <div style="display: flex; justify-content: center;">
            <button id="lowBtn" class="btn side-btn selected">LOW (1-49)</button>
            <button id="highBtn" class="btn side-btn">HIGH (50-98)</button>
        </div>

        <button id="placeBetBtn" class="btn place-bet-btn">PLACE BET NOW</button>
    </div>

    <script>
        const CONTRACT_ADDRESS = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";
        let sideLow = true;

        // TonConnect UI Init
        let tonConnectUI;
        function initTon() {
            try {
                tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: 'https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json',
                    buttonRootId: 'ton-connect'
                });
            } catch(e) { console.error(e); }
        }
        initTon();

        const lowBtn = document.getElementById('lowBtn');
        const highBtn = document.getElementById('highBtn');
        const placeBetBtn = document.getElementById('placeBetBtn');

        lowBtn.onclick = () => { sideLow = true; updateUI(); };
        highBtn.onclick = () => { sideLow = false; updateUI(); };

        function updateUI() {
            lowBtn.className = sideLow ? "btn side-btn selected" : "btn side-btn";
            highBtn.className = !sideLow ? "btn side-btn selected" : "btn side-btn";
        }

        placeBetBtn.onclick = async () => {
            if (!tonConnectUI || !tonConnectUI.connected) {
                alert("ကျေးဇူးပြု၍ Wallet ကို Connect အရင်လုပ်ပါ။ (ခလုတ်မပေါ်သေးလျှင် Refresh လုပ်ပါ)");
                return;
            }

            try {
                // TonWeb စစ်ဆေးခြင်း
                if (typeof TonWeb === 'undefined') {
                    alert("အင်တာနက်နှေးနေသဖြင့် Library မတက်သေးပါ။ ခဏစောင့်ပေးပါ။");
                    return;
                }

                const amount = document.getElementById('betAmount').value;
                const tw = new TonWeb();
                const cell = new TonWeb.boc.Cell();

                // Failed ပြဿနာကို ဖြေရှင်းရန် တိကျသော Bits Layout
                cell.bits.writeUint(0xAAAABBBB, 32); // Opcode
                cell.bits.writeBit(sideLow);        // Side
                cell.bits.writeBit(false);          // Referrer = Null (Flag 0)

                const payloadBoc = TonWeb.utils.bytesToBase64(await cell.toBoc());

                await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [{
                        address: CONTRACT_ADDRESS,
                        amount: TonWeb.utils.toNano(amount).toString(),
                        payload: payloadBoc
                    }]
                });

            } catch (err) {
                alert("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
