<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golden Game PRO</title>

<script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
}
.gold{ color:#f1c40f; }
button{ padding:12px; margin:5px; border:none; border-radius:10px; width:100%; }
.low,.high{ background:#334155; color:#94a3b8; }
.active{ background:#f1c40f; color:black; }
.green{ background:#2ecc71; }
.blue{ background:#3498db; }
</style>
</head>

<body>

<h2 class="gold">🎰 GOLDEN GAME</h2>

<div id="wallet"></div>

<div class="card">

<h3>Pending: <span id="pending">0</span> TON</h3>
<h4>Referral: <span id="ref">0</span> TON</h4>

<input id="amount" value="0.2">

<button id="lowBtn" class="low active">LOW</button>
<button id="highBtn" class="high">HIGH</button>

<button class="green" onclick="placeBet()">BET</button>
<button class="blue" onclick="claimWin()">CLAIM</button>

</div>

<script>

const CONTRACT = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";

let userAddress = null;
let sideLow = true;

const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
    buttonRootId: "wallet"
});

// UI toggle
lowBtn.onclick=()=>{sideLow=true;lowBtn.classList.add("active");highBtn.classList.remove("active");}
highBtn.onclick=()=>{sideLow=false;highBtn.classList.add("active");lowBtn.classList.remove("active");}

// connect
tonConnectUI.onStatusChange(wallet=>{
    if(wallet){
        userAddress = wallet.account.address;
        console.log("Wallet:", userAddress);
        loadAll();
    }
});


// ✅ CORRECT GETTER (DIRECT RPC)
async function runGetter(method){

    try{

        // 🔥 IMPORTANT: address as string slice
        const stack = [
            ["tvm.Slice", userAddress]
        ];

        const body = {
            id:1,
            jsonrpc:"2.0",
            method:"runGetMethod",
            params:{
                address: CONTRACT,
                method: method,
                stack: stack
            }
        };

        const res = await fetch("https://toncenter.com/api/v2/jsonRPC",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(body)
        });

        const data = await res.json();

        console.log("RAW:", method, data);

        // ✅ PARSE SAFE
        let val = data.result.stack[0][1];

        if(val.startsWith("0x")){
            val = BigInt(val).toString();
        }

        // nano → TON
        return (Number(val)/1e9).toFixed(3);

    }catch(e){
        console.error("Getter Error:", e);
        return "0";
    }
}


// load both
async function loadAll(){
    if(!userAddress) return;

    const p = await runGetter("pendingWin");
    const r = await runGetter("referralBalance");

    document.getElementById("pending").innerText = p;
    document.getElementById("ref").innerText = r;
}


// BET
async function placeBet(){
    try{

        const bet = document.getElementById("amount").value;

        const tx = {
            validUntil: Math.floor(Date.now()/1000)+360,
            messages:[{
                address: CONTRACT,
                amount: (parseFloat(bet)+0.05)*1e9+"",
                payload: btoa("\xAA\xAA\xBB\xBB") // simplified
            }]
        };

        await tonConnectUI.sendTransaction(tx);

        setTimeout(loadAll,5000);

    }catch(e){ alert(e.message); }
}


// CLAIM
async function claimWin(){
    try{

        await tonConnectUI.sendTransaction({
            validUntil: Math.floor(Date.now()/1000)+300,
            messages:[{
                address: CONTRACT,
                amount: "50000000",
                payload: btoa("Claim")
            }]
        });

        document.getElementById("pending").innerText="0";

        setTimeout(loadAll,5000);

    }catch(e){ alert(e.message); }
}

// auto refresh
setInterval(loadAll,5000);

</script>

</body>
</html>
