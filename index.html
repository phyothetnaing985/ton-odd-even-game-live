<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>GOLDEN LOW-HIGH | LIVE</title>
    
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://bundle.run/tonweb@0.0.66"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #0b0e11; --card: #161b22; --accent: #f3ba2f; --green: #00c087; --text: #eaecef; --nav: #161b22; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; padding-bottom: 80px; overflow-x: hidden; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; padding: 10px 15px; background: var(--card); align-items: center; border-bottom: 1px solid #2b3139; position: sticky; top: 0; z-index: 1000; }
        
        /* ခလုတ်နေရာကို သေချာသတ်မှတ်ခြင်း */
        #ton-connect-btn { min-width: 140px; display: flex; justify-content: flex-end; }

        .screen { display: none; padding: 15px; flex-direction: column; align-items: center; }
        .active { display: flex; }

        /* Game Card & Visuals */
        .game-img { width: 100%; border-radius: 15px; border: 1px solid #333; margin-bottom: 15px; }

        /* Payout Display */
        .display-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
        .box { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #2b3139; }
        .label { font-size: 0.7rem; opacity: 0.6; display: block; }
        .val { font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        /* Slider - အပြာရောင် မျဉ်းတန်း */
        .slider { width: 100%; height: 8px; border-radius: 5px; background: #2b3139; outline: none; margin: 25px 0; -webkit-appearance: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #0088cc; cursor: pointer; border: 3px solid white; box-shadow: 0 0 10px rgba(0,136,204,0.5); }

        .btn-side-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px; }
        .btn-side { padding: 15px; border-radius: 10px; border: 1px solid #333; background: #1c2128; color: white; font-weight: bold; }
        .selected { border: 2px solid var(--accent); background: rgba(243, 186, 47, 0.1); }

        .btn-main { width: 100%; padding: 18px; border-radius: 12px; background: var(--green); color: white; font-weight: bold; font-size: 1rem; border: none; }

        /* Bottom Nav */
        .footer { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--nav); display: flex; border-top: 1px solid #2b3139; }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; opacity: 0.5; }
        .nav-item.active-nav { color: var(--accent); opacity: 1; }
    </style>
</head>
<body>

<div class="header">
    <div style="color: var(--accent); font-weight: bold; font-size: 0.9rem;">GOLDEN LOW-HIGH</div>
    <div id="ton-connect-btn"></div>
</div>

<div id="lobby-screen" class="screen active">
    <img src="https://i.postimg.cc/XJfvQK5S/IMG-20260115-210549.png" class="game-img">
    <div style="width: 100%; background: var(--card); padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <div style="font-weight: bold;">LOW / HIGH</div>
            <div style="font-size: 0.7rem; color: var(--green);">TACT SMART CONTRACT v3.1</div>
        </div>
        <button class="btn-main" style="width: 80px; padding: 10px;" onclick="showScreen('play-screen')">PLAY</button>
    </div>
</div>

<div id="play-screen" class="screen">
    <img src="https://i.postimg.cc/8zfNZBQP/IMG-20260115-210803.png" class="game-img">
    
    <div class="display-container">
        <div class="box">
            <span class="label">YOUR BET</span>
            <span class="val" id="bet-display">0.1</span> <small>TON</small>
        </div>
        <div class="box">
            <span class="label">WIN PAYOUT (1.85x)</span>
            <span class="val" style="color:var(--green)" id="win-display">0.18</span> <small>TON</small>
        </div>
    </div>

    <input type="range" min="0.1" max="1.0" step="0.1" value="0.1" class="slider" id="betSlider">

    <div class="btn-side-box">
        <button class="btn-side selected" id="low-btn" onclick="selectSide(true)">LOW (1-49)</button>
        <button class="btn-side" id="high-btn" onclick="selectSide(false)">HIGH (50-98)</button>
    </div>

    <button class="btn-main" id="bet-btn" onclick="placeBet()">PLACE BET NOW</button>
</div>

<div class="footer">
    <div class="nav-item active-nav" id="nav-lobby" onclick="showScreen('lobby-screen')">
        <i class="fas fa-home" style="font-size: 1.2rem;"></i><span>Lobby</span>
    </div>
    <div class="nav-item" id="nav-invite">
        <i class="fas fa-users" style="font-size: 1.2rem;"></i><span>Invite</span>
    </div>
</div>

<script>
    let isLow = true;
    let tonConnectUI;

    async function init() {
        // Connect Wallet ခလုတ်ကို Initializing လုပ်ခြင်း
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
            buttonRootId: 'ton-connect-btn'
        });

        // Slider Logic - Real-time Calculation
        const slider = document.getElementById('betSlider');
        slider.oninput = function() {
            const bet = parseFloat(this.value);
            document.getElementById('bet-display').innerText = bet.toFixed(1);
            // 0.85x payout calculation
            document.getElementById('win-display').innerText = (bet * 1.85).toFixed(2);
        };
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-lobby').classList.toggle('active-nav', id === 'lobby-screen');
    }

    function selectSide(low) {
        isLow = low;
        document.getElementById('low-btn').classList.toggle('selected', low);
        document.getElementById('high-btn').classList.toggle('selected', !low);
    }

    async function placeBet() {
        if (!tonConnectUI.connected) {
            alert("ကျေးဇူးပြု၍ Wallet အရင်ချိတ်ပါ။");
            return;
        }
        // ထပ်မံလောင်းခြင်းမှ ကာကွယ်ရန် ခလုတ်ကို ပိတ်ထားမည်
        document.getElementById('bet-btn').disabled = true;
        document.getElementById('bet-btn').innerText = "SENDING...";
        
        try {
            const amount = TonWeb.utils.toNano(document.getElementById('bet-display').innerText);
            
            // Adrian Leon ၏ (1) serialization order အတိုင်းပြုလုပ်ခြင်း
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32); // Opcode
            cell.bits.writeBit(isLow);           // Side
            cell.bits.writeBit(false);          // No Referrer (0 bit)

            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc());

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI",
                    amount: amount.toString(),
                    payload: payload,
                    bounce: false
                }]
            });
        } catch (e) {
            console.error(e);
        } finally {
            document.getElementById('bet-btn').disabled = false;
            document.getElementById('bet-btn').innerText = "PLACE BET NOW";
        }
    }

    window.onload = init;
</script>

</body>
</html>
