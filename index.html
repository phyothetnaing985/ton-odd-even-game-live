<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN GAME V1.9 PRO - CASINO</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --gold: #f1c40f; --dark: #0f172a; --card: #1e293b; --green: #2ecc71; --blue: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; }
        #wallet { margin-bottom: 25px; display: flex; justify-content: center; }
        .card { background: var(--card); border-radius: 24px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid rgba(241, 196, 15, 0.2); text-align: center; }
        h2 { color: var(--gold); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        
        .win-display { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--gold); }
        .win-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        .win-amount { font-size: 28px; font-weight: bold; color: var(--gold); display: block; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 14px; color: #94a3b8; margin-left: 5px; }
        input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 12px; color: white; font-size: 18px; box-sizing: border-box; margin-top: 8px; transition: 0.3s; }
        input:focus { border-color: var(--gold); outline: none; }

        .btn-side { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .side-opt { background: #334155; color: #94a3b8; }
        .side-opt.active { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(241, 196, 15, 0.4); }
        
        .bet-btn { background: var(--green); color: white; width: 100%; font-size: 18px; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); }
        .bet-btn:active { transform: scale(0.98); }
        .claim-btn { background: var(--blue); color: white; width: 100%; margin-top: 15px; font-size: 16px; }
        
        .footer-info { margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 GOLDEN V2</h2>
    
    <div id="wallet"></div>

    <div class="card">
        <div class="win-display">
            <span class="win-label">Pending Winnings</span>
            <span id="pendingDisplay" class="win-amount">0.00 TON</span>
        </div>

        <div class="input-group">
            <label>BET AMOUNT (TON)</label>
            <input type="number" id="amount" value="0.2" step="0.1" oninput="calcTotal()">
            <div style="font-size: 11px; color: #64748b; margin-top: 5px;">Total incl. gas: <span id="totalEst">0.25</span> TON</div>
        </div>

        <div class="btn-side">
            <button id="lowBtn" class="side-opt active">LOW (1-49)</button>
            <button id="highBtn" class="side-opt">HIGH (50-98)</button>
        </div>

        <button class="bet-btn" onclick="placeBet()">🎯 PLACE BET</button>
        <button class="claim-btn" onclick="claimWin()">💸 CLAIM WINNINGS</button>
        
        <div class="footer-info" id="refStatus">Referrer: None</div>
    </div>
</div>

<script>
    const CONTRACT = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";
    let sideLow = true;
    let userAddress = null;
    let referrer = new URLSearchParams(window.location.search).get('ref');

    if(referrer) document.getElementById('refStatus').innerText = "Referrer Active: " + referrer.slice(0,6)+"..."+referrer.slice(-4);

    const tonweb = new TonWeb(new TonWeb.HttpProvider("https://toncenter.com/api/v2/jsonRPC"));
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
        buttonRootId: "wallet"
    });

    tonConnectUI.onStatusChange(wallet => {
        if (wallet) {
            userAddress = wallet.account.address;
            loadPending();
        }
    });

    const lowBtn = document.getElementById("lowBtn");
    const highBtn = document.getElementById("highBtn");
    lowBtn.onclick = () => { sideLow = true; lowBtn.classList.add("active"); highBtn.classList.remove("active"); };
    highBtn.onclick = () => { sideLow = false; highBtn.classList.add("active"); lowBtn.classList.remove("active"); };

    function calcTotal() {
        const val = parseFloat(document.getElementById("amount").value || 0);
        document.getElementById("totalEst").innerText = (val + 0.05).toFixed(2);
    }

    async function loadPending() {
        if (!userAddress) return;
        try {
            const addr = new TonWeb.utils.Address(userAddress);
            const result = await tonweb.provider.call2(CONTRACT, "pendingWin", [["tvm.Slice", addr.toString(true, true, true)]]);
            document.getElementById("pendingDisplay").innerText = TonWeb.utils.fromNano(result[0]) + " TON";
        } catch (e) { console.error(e); }
    }

    async function placeBet() {
        try {
            const bet = document.getElementById("amount").value;
            const amount = TonWeb.utils.toNano(bet).add(TonWeb.utils.toNano("0.05"));
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32);
            cell.bits.writeBit(sideLow);
            if (referrer) cell.bits.writeAddress(new TonWeb.utils.Address(referrer));
            else cell.bits.writeAddress(null);

            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));
            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [{ address: CONTRACT, amount: amount.toString(), payload: payload }]
            });
            setTimeout(loadPending, 5000);
        } catch (e) { alert(e.message); }
    }

    async function claimWin() {
        try {
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0, 32); // Comment prefix
            cell.bits.writeString("Claim");
            const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));
            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: CONTRACT, amount: TonWeb.utils.toNano("0.05").toString(), payload: payload }]
            });
            setTimeout(loadPending, 6000);
        } catch (e) { alert(e.message); }
    }

    setInterval(loadPending, 5000); // Auto-refresh every 5s
</script>
</body>
</html>
