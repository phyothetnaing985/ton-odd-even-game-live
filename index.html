<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>GOLDEN LOW-HIGH | v4 Casino Grade</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #0b0e11; --card: #161b22; --accent: #f3ba2f; --green: #00c087; --red: #ff4d4d; --text: #eaecef; --nav: #161b22; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; padding: 12px 15px; background: var(--card); align-items: center; border-bottom: 1px solid #2b3139; position: sticky; top: 0; z-index: 1000; }
        .screen { display: none; padding: 15px; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .game-img { width: 100%; max-width: 400px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .box { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #2b3139; width: 100%; }
        .val { font-size: 1.4rem; font-weight: bold; color: var(--accent); }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 4px; display: block; }
        .slider { width: 100%; max-width: 400px; height: 10px; border-radius: 5px; background: #2b3139; outline: none; margin: 25px 0; -webkit-appearance: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 4px solid #fff; cursor: pointer; }
        .btn-side { padding: 18px; border-radius: 12px; border: 2px solid #333; background: #1c2128; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; }
        .selected { border-color: var(--accent); background: rgba(243, 186, 47, 0.1); color: var(--accent); }
        .btn-main { width: 100%; max-width: 400px; padding: 18px; border-radius: 12px; background: var(--green); color: white; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; }
        .btn-main:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--nav); display: flex; border-top: 1px solid #2b3139; }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.8rem; opacity: 0.6; color: var(--text); cursor: pointer; }
        .active-nav { color: var(--accent); opacity: 1; font-weight: bold; }
        .status-msg { margin-top: 15px; font-size: 0.85rem; padding: 10px; border-radius: 8px; text-align: center; width: 100%; max-width: 380px; display: none; }
    </style>
</head>
<body>

<div class="header">
    <div id="ton-connect-btn"></div>
    <div style="font-weight: bold; color: var(--accent);">GOLDEN v4</div>
</div>

<div id="lobby-screen" class="screen active">
    <img src="https://i.ibb.co/JjLp1zJ8/file-00000000740871fa81847d4e88a5158b.png" class="game-img">
    <div style="width:100%; max-width:400px; background:var(--card); padding:20px; border-radius:15px; display:flex; justify-content:space-between; align-items:center;">
        <div>
            <div style="font-weight:bold; color:var(--accent);">LOW-HIGH</div>
            <div style="font-size:0.7rem; color:var(--green);">PROVABLY FAIR</div>
        </div>
        <button class="btn-main" style="width:100px; padding:12px;" onclick="showScreen('play-screen')">PLAY</button>
    </div>
</div>

<div id="play-screen" class="screen">
    <img src="https://i.ibb.co/qYnXY1CW/1772808401788.png" class="game-img">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:400px;">
        <div class="box"><span class="label">Bet Amount</span><span class="val" id="bet-display">0.10</span></div>
        <div class="box"><span class="label">Win Payout</span><span class="val" id="win-display" style="color:var(--green)">0.18</span></div>
    </div>
    <input type="range" min="0.1" max="1.0" step="0.1" value="0.1" class="slider" id="betSlider">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:400px; margin-bottom:20px;">
        <button class="btn-side selected" id="low-btn" onclick="selectSide(true)">LOW (1-49)</button>
        <button class="btn-side" id="high-btn" onclick="selectSide(false)">HIGH (50-98)</button>
    </div>
    <button class="btn-main" id="bet-btn" onclick="placeBet()">PLACE BET NOW</button>
    <div id="status-box" class="status-msg"></div>
</div>

<div id="invite-screen" class="screen">
    <div style="width:100%; max-width:400px; background:var(--card); padding:25px; border-radius:20px; border:1px solid var(--accent); text-align:center;">
        <i class="fas fa-gift" style="font-size:2.5rem; color:var(--accent); margin-bottom:15px;"></i>
        <h3>Refer & Earn 5%</h3>
        <div id="ref-link" style="background:rgba(0,0,0,0.2); padding:12px; border-radius:10px; font-size:0.7rem; word-break:break-all; margin:15px 0; border:1px dashed #555;">Connect Wallet to Get Link</div>
        <button class="btn-main" style="background:var(--accent); color:black;" onclick="copyLink()">COPY INVITE LINK</button>
    </div>
</div>

<div class="footer">
    <div class="nav-item active-nav" id="nav-lobby" onclick="showScreen('lobby-screen')"><i class="fas fa-home"></i><span>Lobby</span></div>
    <div class="nav-item" id="nav-invite" onclick="showScreen('invite-screen')"><i class="fas fa-users"></i><span>Invite</span></div>
</div>

<script>
    const CONTRACT_ADDRESS = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";
    const MANIFEST_URL = "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json";
    let isSideLow = true;
    let tonConnectUI;
    const tonWeb = new TonWeb();

    async function init() {
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: MANIFEST_URL,
            buttonRootId: 'ton-connect-btn'
        });

        const slider = document.getElementById('betSlider');
        slider.oninput = function() {
            const val = parseFloat(this.value);
            document.getElementById('bet-display').innerText = val.toFixed(2);
            document.getElementById('win-display').innerText = (val * 1.85).toFixed(2);
        };

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                const userAddr = wallet.account.address;
                const friendlyAddr = new TonWeb.utils.Address(userAddr).toString(true, true, true);
                document.getElementById('ref-link').innerText = window.location.origin + window.location.pathname + "?ref=" + friendlyAddr;
            }
        });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-lobby').classList.toggle('active-nav', id === 'lobby-screen' || id === 'play-screen');
        document.getElementById('nav-invite').classList.toggle('active-nav', id === 'invite-screen');
    }

    function selectSide(low) {
        isSideLow = low;
        document.getElementById('low-btn').classList.toggle('selected', low);
        document.getElementById('high-btn').classList.toggle('selected', !low);
    }

    async function placeBet() {
        if (!tonConnectUI.connected) { alert("Please Connect Wallet!"); return; }
        
        const btn = document.getElementById('bet-btn');
        const statusBox = document.getElementById('status-box');
        
        // Critical Safeguard: Double Click Block
        btn.disabled = true;
        statusBox.style.display = "block";
        statusBox.style.background = "rgba(243, 186, 47, 0.1)";
        statusBox.innerText = "Awaiting Wallet Confirmation...";

        try {
            const betVal = parseFloat(document.getElementById('bet-display').innerText);
            
            // Critical Safeguard: Gas Margin (+0.02 TON to prevent refund)
            const safeAmount = betVal + 0.02;
            const nanoAmount = TonWeb.utils.toNano(safeAmount.toString()).toString();

            // Critical Safeguard: Exact Serialization
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32); // Opcode
            cell.bits.writeBit(isSideLow);        // sideLow (Bool)

            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');

            // Critical Safeguard: Optional Address Format
            if (ref && TonWeb.utils.Address.isValid(ref)) {
                cell.bits.writeBit(true); // Referrer Exists? Yes (1 bit)
                cell.bits.writeAddress(new TonWeb.utils.Address(ref)); // Address
            } else {
                cell.bits.writeBit(false); // Referrer Exists? No (1 bit)
            }

            const payloadBoc = TonWeb.utils.bytesToBase64(await cell.toBoc());

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: CONTRACT_ADDRESS,
                    amount: nanoAmount,
                    payload: payloadBoc,
                    bounce: false // Critical Safeguard: Bounce False
                }]
            });

            statusBox.style.background = "rgba(0, 192, 135, 0.1)";
            statusBox.innerText = "Bet Placed! Wait for result...";
        } catch (e) {
            statusBox.style.background = "rgba(255, 77, 77, 0.1)";
            statusBox.innerText = "Transaction Cancelled.";
        } finally {
            setTimeout(() => { 
                btn.disabled = false; 
                statusBox.style.display = "none";
            }, 5000);
        }
    }

    function copyLink() {
        const link = document.getElementById('ref-link').innerText;
        if (link.includes("Connect")) return;
        navigator.clipboard.writeText(link);
        alert("Invite link copied!");
    }

    window.onload = init;
</script>
</body>
</html>
