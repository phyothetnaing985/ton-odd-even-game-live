<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Golden LOW HIGH</title>

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://unpkg.com/ton-core@latest/dist/ton-core.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
padding-bottom:80px;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
background:#020617;
align-items:center;
}

.screen{
display:none;
padding:20px;
}

.active{
display:block;
}

.gameimg{
width:100%;
border-radius:15px;
margin-bottom:15px;
}

.card{
background:#161b22;
padding:15px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.playbtn{
background:#22c55e;
border:none;
padding:12px 25px;
border-radius:10px;
color:white;
font-weight:bold;
}

.betbox{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.box{
background:#161b22;
padding:15px;
border-radius:12px;
text-align:center;
}

.slider{
width:100%;
margin:25px 0;
}

.sidebuttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.side{
padding:15px;
border-radius:8px;
border:none;
background:#222;
color:white;
font-weight:bold;
}

.selected{
background:#f3ba2f;
color:black;
}

.betbtn{
width:100%;
padding:18px;
background:#22c55e;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
}

footer{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

footer button{
flex:1;
padding:18px;
background:none;
border:none;
color:white;
}

</style>
</head>

<body>

<header>

<div onclick="toggleTheme()">🌙/☀️</div>

<div id="connect"></div>

</header>

<!-- LOBBY -->

<div id="lobby" class="screen active">

<img src="https://i.ibb.co/JjLp1zJ8/file-00000000740871fa81847d4e88a5158b.png"
class="gameimg">

<div class="card">

<div>
<h2>LOW / HIGH</h2>

<div style="font-size:12px;color:#22c55e">
Provably Fair Blockchain Game
</div>

</div>

<div>

<button class="playbtn" onclick="show('play')">
PLAY
</button>

</div>

</div>

</div>

<!-- PLAY -->

<div id="play" class="screen">

<img src="https://i.ibb.co/qYnXY1CW/1772808401788.png"
class="gameimg">

<div class="betbox">

<div class="box">
BET<br>
<span id="bet">0.1</span> TON
</div>

<div class="box">
WIN<br>
<span id="win">0.185</span> TON
</div>

</div>

<input type="range"
min="0.1"
max="1"
step="0.01"
value="0.1"
id="slider"
class="slider">

<div class="sidebuttons">

<button id="low" class="side selected"
onclick="selectSide(true)">
LOW (1-49)
</button>

<button id="high" class="side"
onclick="selectSide(false)">
HIGH (50-98)
</button>

</div>

<button class="betbtn" id="betbtn" onclick="bet()">
PLACE BET NOW
</button>

<div id="status" style="margin-top:15px;color:#f3ba2f"></div>

</div>

<!-- INVITE -->

<div id="invite" class="screen">

<h3>Refer & Earn</h3>

<p>
Earn 5% reward from friend's winning bet.
</p>

<div style="background:#161b22;padding:15px;border-radius:12px">

Rewards
<div id="refbal" style="color:#22c55e;font-weight:bold">
0 TON
</div>

</div>

<br>

<input id="reflink" readonly
style="width:100%;padding:12px;border-radius:8px;border:none">

<br><br>

<button onclick="copy()"
style="width:100%;padding:14px;background:#f3ba2f;border:none;border-radius:10px">
COPY LINK
</button>

</div>

<footer>

<button onclick="show('lobby')">Lobby</button>
<button onclick="show('invite')">Invite</button>

</footer>

<script>

/* ========= CONFIG ========= */

const CONTRACT="EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI"

let sideLow=true
let tonConnect
let betting=false

/* ========= INIT ========= */

window.onload=()=>{

tonConnect=new TON_CONNECT_UI.TonConnectUI({
manifestUrl:"https://yourdomain.com/tonconnect-manifest.json",
buttonRootId:"connect"
})

slider.oninput=()=>{

let b=parseFloat(slider.value)

bet.innerText=b.toFixed(2)
win.innerText=(b*1.85).toFixed(3)

}

}

/* ========= SERIALIZATION SAFE ========= */

function buildBetCell(sideLow){

const builder = window.TonCore.beginCell()

builder.storeUint(0xAAAABBBB,32)
builder.storeBit(sideLow)
builder.storeBit(false)

return builder.endCell()

}

/* ========= BET ========= */

async function bet(){

if(betting) return

if(!tonConnect.connected){
alert("Connect wallet first")
return
}

if(!confirm("Confirm bet transaction ?")) return

betting=true

betbtn.innerText="CONFIRMING..."

try{

const amount = parseFloat(bet.innerText)

const cell = buildBetCell(sideLow)

await tonConnect.sendTransaction({

validUntil:Math.floor(Date.now()/1000)+300,

messages:[{
address:CONTRACT,
amount:(amount*1e9).toString(),
payload:cell.toBoc().toString("base64"),
bounce:false
}]

})

status.innerText="Transaction sent"

}catch(e){

alert(e.message)

}

beting=false
betbtn.innerText="PLACE BET NOW"

}

/* ========= UI ========= */

function selectSide(low){

sideLow=low

low.classList.toggle("selected",low)
high.classList.toggle("selected",!low)

}

function show(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

function toggleTheme(){
document.body.classList.toggle("light")
}

function copy(){
navigator.clipboard.writeText(reflink.value)
alert("Referral link copied")
}

</script>

</body>
</html>
