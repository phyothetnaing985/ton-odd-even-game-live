<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGG MASTER V2.7 - LIVE TRACKING</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --gold:#f1c40f; --dark:#0f172a; --card:#1e293b; --green:#2ecc71; --red:#ff4757; --blue:#3498db; }
        body { background: var(--dark); color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(241,196,15,0.2); }
        b { color: var(--gold); font-size: 22px; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-bet { background: var(--green); color: white; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .win { color: var(--green); }
        .lose { color: var(--red); }
        .waiting { color: var(--gold); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        input { width: 80%; padding: 10px; margin: 10px; border-radius: 8px; border: none; text-align: center; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:var(--gold);">🎰 GGG MASTER V2.7</h2>
    <div id="wallet"></div>

    <div class="card">
        <div>PENDING: <b id="pending">0.000</b> TON</div>
        <input type="number" id="amount" value="0.1" step="0.1">
        <div style="display:flex; gap:10px;">
            <button id="lowBtn" style="background:var(--gold);" onclick="setSide(true)">LOW</button>
            <button id="highBtn" style="background:#334155; color:white;" onclick="setSide(false)">HIGH</button>
        </div>
        <button class="btn-bet" onclick="placeBet()">PLACE BET</button>
        <button style="background:var(--blue); color:white;" onclick="claimWin()">CLAIM WINNINGS</button>
    </div>

    <div class="card">
        <h4 style="margin:0; color:var(--gold);">🕒 SESSION HISTORY</h4>
        <div id="historyList">No bets in this session.</div>
    </div>
</div>

<script>
    const CONTRACT_ADDR = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";
    const API = "https://toncenter.com/api/v2";
    const tonweb = new TonWeb();
    let userAddress = null;
    let isSideLow = true;
    let currentPending = 0;

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
        buttonRootId: "wallet"
    });

    tonConnectUI.onStatusChange(w => { if (w) { userAddress = w.account.address; loadData(); } });

    async function loadData() {
        if (!userAddress) return;
        try {
            const addr = new TonWeb.utils.Address(userAddress);
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeAddress(addr);
            const b64 = TonWeb.utils.bytesToBase64(await cell.toBoc(false));
            
            const r = await fetch(`${API}/runGetMethod`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ "address": CONTRACT_ADDR, "method": "pendingWin", "stack": [["tvm.Slice", b64]] })
            });
            const d = await r.json();
            if (d.result?.stack?.[0]?.[1]) {
                currentPending = parseFloat(TonWeb.utils.fromNano(BigInt(d.result.stack[0][1]).toString()));
                document.getElementById('pending').innerText = currentPending.toFixed(3);
            }
        } catch(e) { console.error(e); }
    }

    function addHistoryRow(id, amount) {
        const historyEl = document.getElementById('historyList');
        if (historyEl.innerText.includes("No bets")) historyEl.innerHTML = "";
        
        const row = document.createElement('div');
        row.className = 'history-item';
        row.id = `bet-${id}`;
        row.innerHTML = `<span>${amount} TON</span> <span class="waiting">RESULT PENDING...</span>`;
        historyEl.prepend(row);
    }

    function updateHistoryRow(id, isWin) {
        const row = document.getElementById(`bet-${id}`);
        if (row) {
            row.querySelector('.waiting').className = isWin ? 'win' : 'lose';
            row.querySelector(isWin ? '.win' : '.lose').innerText = isWin ? 'WIN 🟢' : 'LOSE 🔴';
        }
    }

    async function placeBet() {
        if (!userAddress) return alert("Connect Wallet!");
        const amount = document.getElementById('amount').value;
        const betId = Date.now();
        const beforeBetPending = currentPending;

        try {
            const total = TonWeb.utils.toNano(amount).add(TonWeb.utils.toNano("0.05"));
            const cell = new TonWeb.boc.Cell();
            cell.bits.writeUint(0xAAAABBBB, 32);
            cell.bits.writeBit(isSideLow);
            cell.bits.writeAddress(null);

            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: CONTRACT_ADDR, amount: total.toString(), payload: TonWeb.utils.bytesToBase64(await cell.toBoc(false)) }]
            });

            // မှတ်တမ်းထဲ WAITING အရင်ထည့်မယ်
            addHistoryRow(betId, amount);

            // ၈ စက္ကန့်နေရင် ရလဒ်စစ်မယ်
            setTimeout(async () => {
                await loadData();
                const isWin = currentPending > beforeBetPending;
                updateHistoryRow(betId, isWin);
            }, 8000);

        } catch (e) { alert("Transaction Cancelled"); }
    }

    function setSide(s) {
        isSideLow = s;
        document.getElementById('lowBtn').style.background = s ? 'var(--gold)' : '#334155';
        document.getElementById('highBtn').style.background = s ? '#334155' : 'var(--gold)';
    }

    async function claimWin() {
        const cell = new TonWeb.boc.Cell();
        cell.bits.writeUint(0, 32); cell.bits.writeString("Claim");
        await tonConnectUI.sendTransaction({
            validUntil: Math.floor(Date.now() / 1000) + 300,
            messages: [{ address: CONTRACT_ADDR, amount: TonWeb.utils.toNano("0.05").toString(), payload: TonWeb.utils.bytesToBase64(await cell.toBoc(false)) }]
        });
    }

    setInterval(loadData, 10000);
</script>
</body>
</html>
