<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Game Casino</title>

<script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0e11;
color:white;
text-align:center;
}

header{
padding:12px;
background:#161b22;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:bold;
color:#f3ba2f;
}

.card{
background:#161b22;
padding:20px;
margin:20px;
border-radius:12px;
}

.slider{
width:80%;
}

button{
padding:14px;
border:none;
border-radius:10px;
background:#00c087;
color:white;
font-weight:bold;
margin-top:10px;
width:80%;
}

.side{
display:flex;
gap:10px;
justify-content:center;
}

.side button{
width:40%;
background:#222;
}

.selected{
border:2px solid #f3ba2f;
color:#f3ba2f;
}

.ref{
font-size:12px;
background:black;
padding:10px;
margin-top:10px;
border-radius:8px;
word-break:break-all;
}

</style>
</head>

<body>

<header>
<div id="ton-connect"></div>
<div class="logo">GOLDEN GAME</div>
</header>

<div class="card">

<h3>BET</h3>

<div id="betValue">0.10 TON</div>

<input type="range" min="0.1" max="1" step="0.05" value="0.1" id="betSlider" class="slider">

<h3>PICK SIDE</h3>

<div class="side">
<button id="lowBtn">LOW (1-49)</button>
<button id="highBtn">HIGH (50-98)</button>
</div>

<button onclick="placeBet()">PLACE BET</button>

<div id="status"></div>

</div>

<div class="card">

<h3>Referral</h3>

<div id="refLink" class="ref">
Connect wallet
</div>

<button onclick="copyRef()">COPY LINK</button>

<button onclick="withdrawRef()">WITHDRAW REWARD</button>

</div>

<script>

const CONTRACT="EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI"

const MANIFEST="https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json"

let tonConnect
let isLow=true

async function init(){

tonConnect=new TON_CONNECT_UI.TonConnectUI({
manifestUrl:MANIFEST,
buttonRootId:"ton-connect"
})

document.getElementById("betSlider").oninput=e=>{
let v=parseFloat(e.target.value)
document.getElementById("betValue").innerText=v.toFixed(2)+" TON"
}

document.getElementById("lowBtn").onclick=()=>{
isLow=true
updateSide()
}

document.getElementById("highBtn").onclick=()=>{
isLow=false
updateSide()
}

tonConnect.onStatusChange(wallet=>{

if(wallet){

const addr=new TonWeb.utils.Address(wallet.account.address).toString(true,true,true)

document.getElementById("refLink").innerText=
window.location.origin+
window.location.pathname+
"?ref="+addr

}

})

updateSide()

}

function updateSide(){

document.getElementById("lowBtn").classList.toggle("selected",isLow)
document.getElementById("highBtn").classList.toggle("selected",!isLow)

}

async function placeBet(){

if(!tonConnect.connected){
alert("Connect wallet")
return
}

const bet=parseFloat(document.getElementById("betSlider").value)

const url=new URLSearchParams(window.location.search)
const ref=url.get("ref")

const cell=new TonWeb.boc.Cell()

cell.bits.writeUint(0xAAAABBBB,32)
cell.bits.writeBit(isLow)

if(ref && TonWeb.utils.Address.isValid(ref)){
cell.bits.writeBit(1)
cell.bits.writeAddress(new TonWeb.utils.Address(ref))
}else{
cell.bits.writeBit(0)
}

const payload=TonWeb.utils.bytesToBase64(await cell.toBoc())

try{

await tonConnect.sendTransaction({

validUntil:Math.floor(Date.now()/1000)+300,

messages:[{

address:CONTRACT,

amount:TonWeb.utils.toNano(bet.toString()).toString(),

payload:payload,

bounce:false

}]

})

document.getElementById("status").innerText="Bet Sent"

}catch(e){

document.getElementById("status").innerText="Cancelled"

}

}

async function withdrawRef(){

if(!tonConnect.connected)return

await tonConnect.sendTransaction({

validUntil:Math.floor(Date.now()/1000)+300,

messages:[{

address:CONTRACT,

amount:TonWeb.utils.toNano("0.05").toString(),

payload:"te6cckEBAQEADgAAGFdpdGhkcmF3UmVme967Bw==",

bounce:false

}]

})

}

function copyRef(){

const txt=document.getElementById("refLink").innerText

if(txt.includes("Connect"))return

navigator.clipboard.writeText(txt)

alert("Copied")

}

init()

</script>

</body>
</html>
