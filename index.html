<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Golden Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
text-align:center;
}

header{
background:#020617;
padding:15px;
font-size:22px;
font-weight:bold;
}

.card{
background:#1e293b;
margin:15px;
padding:20px;
border-radius:12px;
}

button{
padding:14px;
margin:6px;
border:none;
border-radius:8px;
font-size:16px;
width:90%;
background:#22c55e;
color:white;
}

button.side{
width:40%;
background:#334155;
}

.selected{
border:2px solid gold;
}

input{
width:90%;
padding:10px;
border-radius:8px;
border:none;
}

</style>
</head>

<body>

<header>🎲 GOLDEN GAME</header>

<div id="ton-connect"></div>

<div class="card">

<h3>Bet Amount</h3>

<input id="betAmount" value="0.1">

<h3>Choose Side</h3>

<button id="lowBtn" class="side">LOW (1-49)</button>
<button id="highBtn" class="side">HIGH (50-98)</button>

<br>

<button onclick="placeBet()">PLACE BET</button>

</div>

<div class="card">

<h3>Referral</h3>

<div id="refLink">Connect wallet</div>

<button onclick="withdrawRef()">Withdraw Referral</button>

</div>

<script>

const CONTRACT =
"EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI"

let sideLow = true

const tonConnect = new TON_CONNECT_UI.TonConnectUI({
manifestUrl:
"https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
buttonRootId:"ton-connect"
})

document.getElementById("lowBtn").onclick=()=>{
sideLow=true
updateSide()
}

document.getElementById("highBtn").onclick=()=>{
sideLow=false
updateSide()
}

function updateSide(){

lowBtn.classList.toggle("selected",sideLow)
highBtn.classList.toggle("selected",!sideLow)

}

tonConnect.onStatusChange(wallet=>{

if(wallet){

const addr = wallet.account.address

const url =
location.origin+
location.pathname+
"?ref="+addr

document.getElementById("refLink").innerText=url

}

})

async function buildBetPayload(){

const tonweb = new TonWeb()

const cell = new TonWeb.boc.Cell()

// opcode
cell.bits.writeUint(0xAAAABBBB,32)

// sideLow
cell.bits.writeBit(sideLow?1:0)

// referral parsing
const params =
new URLSearchParams(window.location.search)

const ref = params.get("ref")

if(ref){

cell.bits.writeBit(1)

const addr =
new TonWeb.utils.Address(ref)

cell.bits.writeAddress(addr)

}else{

cell.bits.writeBit(0)

}

return TonWeb.utils.bytesToBase64(
await cell.toBoc()
)

}

async function placeBet(){

if(!tonConnect.connected){

alert("Connect wallet first")

return
}

const bet =
document.getElementById("betAmount").value

const payload =
await buildBetPayload()

await tonConnect.sendTransaction({

validUntil:
Math.floor(Date.now()/1000)+600,

messages:[{

address:CONTRACT,

amount:
TonWeb.utils.toNano(bet).toString(),

payload:payload

}]

})

}

async function withdrawRef(){

if(!tonConnect.connected)return

await tonConnect.sendTransaction({

validUntil:
Math.floor(Date.now()/1000)+600,

messages:[{

address:CONTRACT,

amount:
TonWeb.utils.toNano("0.05").toString(),

payload:
TonWeb.utils.bytesToBase64(
new TextEncoder().encode("WithdrawRef")
)

}]

})

}

</script>

</body>
</html>
