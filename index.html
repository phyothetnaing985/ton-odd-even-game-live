<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden V6 - Fixed Opcode</title>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.bundle.js"></script>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.dot.js"></script>
</head>
<body>

    <button id="bet-button" style="padding: 20px; background: #00df8e; color: white; border: none; border-radius: 10px; cursor: pointer;">
        PLACE BET NOW
    </button>

    <script>
        // 1. Contract Address သတ်မှတ်ခြင်း
        const contractAddress = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";

        // 2. TonConnect ဆက်သွယ်ခြင်း
        const connector = new TonConnectSDK.TonConnect();

        async function placeBet() {
            try {
                const tonWeb = new TonWeb();
                
                // --- အရေးကြီးဆုံးအပိုင်း (Opcode ပြင်ဆင်ခြင်း) ---
                // Tact တွင် 'message Bet' အတွက် အသုံးများဆုံး Opcode ဖြစ်သော 0x5cf05177 ကို သုံးထားသည်
                const cell = new TonWeb.boc.Cell();
                cell.bits.writeUint(0x5cf05177, 32); // 32-bit Opcode (Fixed)
                
                // လောင်းကြေး (ဥပမာ - 0.3 TON)
                const amount = TonWeb.utils.toNano("0.3");

                // Payload ကို Base64 ပြောင်းခြင်း
                const payload = TonWeb.utils.bytesToBase64(await cell.toBoc());

                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [
                        {
                            address: contractAddress,
                            amount: amount.toString(),
                            payload: payload
                        }
                    ]
                };

                await connector.sendTransaction(transaction);
                alert("Bet Transaction Sent! Please wait for confirmation.");

            } catch (error) {
                console.error("Bet Error:", error);
                alert("Error: " + error.message);
            }
        }

        // Button ကိုနှိပ်လျှင် placeBet အလုပ်လုပ်စေရန်
        document.getElementById('bet-button').onclick = placeBet;

    </script>
</body>
</html>
