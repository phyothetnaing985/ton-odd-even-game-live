<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN GAME V1.9 PRO</title>

<script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>

<style>
body {
    font-family: Arial;
    background: linear-gradient(180deg,#0b1220,#020617);
    color: white;
    text-align: center;
}
.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
}
.card {
    background: #1c2a3a;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}
.green { background: #22c55e; }
.blue { background: #3b82f6; }
.gray { background: #334155; }
.active { border: 2px solid gold; }

.info {
    margin-top:10px;
    font-size:14px;
    color:#94a3b8;
}
.winbox {
    background:#111827;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🎲 GOLDEN GAME PRO</h2>

<div id="wallet"></div>

<div class="card">

<h3>Bet Amount (TON)</h3>
<input id="amount" value="0.2" oninput="updateTotal()">

<div class="info">
Total (with gas): <span id="total">0.25</span> TON
</div>

<h3>Choose Side</h3>
<button id="lowBtn" class="active">LOW (1-49)</button>
<button id="highBtn" class="gray">HIGH (50-98)</button>

<button class="green" onclick="placeBet()">🎯 PLACE BET</button>

<div class="winbox">
💰 Pending Win: <span id="pending">0</span> TON
</div>

<button class="blue" onclick="claimWin()">💸 CLAIM WIN</button>

</div>

</div>

<script>

const CONTRACT = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";

let sideLow = true;
let referrer = null;
let userAddress = null;

// ✅ REFERRAL AUTO DETECT
const params = new URLSearchParams(window.location.search);
if (params.get("ref")) {
    referrer = params.get("ref");
}

// UI buttons
const lowBtn = document.getElementById("lowBtn");
const highBtn = document.getElementById("highBtn");

lowBtn.onclick = () => {
    sideLow = true;
    lowBtn.classList.add("active");
    highBtn.classList.remove("active");
};

highBtn.onclick = () => {
    sideLow = false;
    highBtn.classList.add("active");
    lowBtn.classList.remove("active");
};

function updateTotal(){
    let bet = parseFloat(document.getElementById("amount").value || 0);
    document.getElementById("total").innerText = (bet + 0.05).toFixed(2);
}

// ✅ TON PROVIDER (IMPORTANT)
const tonweb = new TonWeb(
    new TonWeb.HttpProvider("https://toncenter.com/api/v2/jsonRPC")
);

// TON CONNECT
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
    buttonRootId: "wallet"
});

// ✅ WALLET CONNECT → AUTO LOAD
tonConnectUI.onStatusChange(async (wallet) => {
    if (wallet) {
        userAddress = wallet.account.address;
        await loadPending();
    }
});

// 🎯 PLACE BET
async function placeBet() {
    try {

        const bet = document.getElementById("amount").value;

        const amount = TonWeb.utils.toNano(bet)
            .add(TonWeb.utils.toNano("0.05"));

        const cell = new TonWeb.boc.Cell();

        cell.bits.writeUint(0xAAAABBBB, 32);
        cell.bits.writeBit(sideLow);

        if (referrer) {
            cell.bits.writeAddress(new TonWeb.Address(referrer));
        } else {
            cell.bits.writeAddress(null);
        }

        const boc = await cell.toBoc(false);
        const payload = TonWeb.utils.bytesToBase64(boc);

        const tx = {
            validUntil: Math.floor(Date.now() / 1000) + 360,
            messages: [
                {
                    address: CONTRACT,
                    amount: amount.toString(),
                    payload: payload
                }
            ]
        };

        await tonConnectUI.sendTransaction(tx);

        // ⏳ Wait then refresh pending
        setTimeout(loadPending, 4000);

    } catch (e) {
        alert("Bet Failed: " + e.message);
    }
}

// 💸 CLAIM WIN
async function claimWin() {
    try {

        const cell = new TonWeb.boc.Cell();
        cell.bits.writeString("Claim");

        const boc = await cell.toBoc(false);
        const payload = TonWeb.utils.bytesToBase64(boc);

        const tx = {
            validUntil: Math.floor(Date.now() / 1000) + 360,
            messages: [
                {
                    address: CONTRACT,
                    amount: TonWeb.utils.toNano("0.05").toString(),
                    payload: payload
                }
            ]
        };

        await tonConnectUI.sendTransaction(tx);

        // ⏳ Refresh after claim
        setTimeout(loadPending, 4000);

    } catch (e) {
        alert("Claim Failed: " + e.message);
    }
}

// 🔥 CORE: LOAD PENDING WIN
async function loadPending() {
    try {

        if (!userAddress) return;

        const addr = new TonWeb.utils.Address(userAddress);

        const result = await tonweb.provider.call2(
            CONTRACT,
            "pendingWin",
            [["tvm.Slice", addr.toString(true, true, true)]]
        );

        let pending = result[0];

        let ton = TonWeb.utils.fromNano(pending);

        document.getElementById("pending").innerText = ton;

    } catch (e) {
        console.error("Pending error:", e);
    }
}

// 🔄 AUTO REFRESH
setInterval(loadPending, 5000);

updateTotal();

</script>

</body>
</html>
