<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Game Pro V1.5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tonweb/0.0.66/tonweb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .card { background: #1e293b; margin: 20px auto; padding: 25px; border-radius: 20px; max-width: 380px; }
        .btn-main { width: 100%; padding: 18px; border-radius: 12px; background: #22c55e; color: white; border: none; font-size: 1.1rem; cursor: pointer; }
        #ton-connect { margin: 20px auto; }
        #status { color: #fbbf24; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header style="padding: 20px; font-size: 24px; font-weight: bold; background: #020617;">🎲 GOLDEN GAME V1.5</header>
    <div id="ton-connect"></div>
    <div id="status">Checking connection...</div>

    <div class="card">
        <h3>Bet Amount (0.2 TON)</h3>
        <button id="betBtn" class="btn-main">PLACE BET NOW</button>
    </div>

    <script>
        const CONTRACT_ADDRESS = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";
        let tonConnectUI;

        // ၁။ Library များ အဆင်သင့်ဖြစ်မဖြစ် စစ်ဆေးခြင်း
        function checkReady() {
            if (window.TonWeb && window.TON_CONNECT_UI) {
                document.getElementById('status').innerText = "✅ Systems Ready";
                document.getElementById('status').style.color = "#22c55e";
                return true;
            }
            document.getElementById('status').innerText = "⏳ Loading Libraries... Please wait";
            return false;
        }

        // ၂။ TonConnect Initialize
        try {
            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json',
                buttonRootId: 'ton-connect'
            });
        } catch (e) { console.error(e); }

        // ၃။ Bet ပြုလုပ်ခြင်း (Referrer Address မပါဘဲ ပို့ခြင်း - Failed မဖြစ်စေရန်)
        document.getElementById('betBtn').onclick = async () => {
            if (!checkReady()) return alert("Library မတက်သေးပါ။ ခဏစောင့်ပါ။");
            if (!tonConnectUI.connected) return alert("Wallet ချိတ်ပေးပါ။");

            try {
                const tw = new window.TonWeb();
                const cell = new tw.boc.Cell();

                // Contract ဖတ်နိုင်မည့် ပုံစံအတိအကျ (Opcode + Side + No-Ref)
                cell.bits.writeUint(0xAAAABBBB, 32); 
                cell.bits.writeBit(true); // Side Low = true
                cell.bits.writeBit(false); // Referrer = None (ဒါမှ Failed မဖြစ်မှာပါ)

                const payload = tw.utils.bytesToBase64(await cell.toBoc());

                await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [{
                        address: CONTRACT_ADDRESS,
                        amount: tw.utils.toNano("0.2").toString(),
                        payload: payload
                    }]
                });
            } catch (err) { alert(err.message); }
        };

        setInterval(checkReady, 2000);
    </script>
</body>
</html>
