<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Golden Game Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.js"></script>
    <style>
        body { background:#0f172a; color:white; font-family:sans-serif; text-align:center; margin:0; }
        .card { background:#1e293b; margin:15px; padding:20px; border-radius:15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { padding:15px; margin:10px; border:none; border-radius:10px; font-weight:bold; width:90%; cursor:pointer; }
        .bet-btn { background:#22c55e; color:white; font-size:18px; }
        .side-btn { width:45%; background:#334155; color:white; }
        .selected { border: 2px solid #fbbf24; background:#475569; }
        input { width:80%; padding:12px; border-radius:8px; border:none; margin:10px; font-size:16px; }
    </style>
</head>
<body>
    <header style="background:#020617; padding:20px; font-size:24px;">🎲 GOLDEN GAME V1.2</header>
    <div id="ton-connect" style="margin:20px auto;"></div>

    <div class="card">
        <h3>Bet Amount (TON)</h3>
        <input id="betAmount" type="number" value="0.2" step="0.1">
        <h3>Pick Your Side</h3>
        <button id="lowBtn" class="side-btn selected">LOW (1-49)</button>
        <button id="highBtn" class="side-btn">HIGH (50-98)</button>
        <button id="betBtn" class="bet-btn" style="margin-top:20px;">PLACE BET NOW</button>
    </div>

    <script>
        const CONTRACT_ADDR = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";
        let sideLow = true;
        const tonweb = new TonWeb();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        // UI Logic
        document.getElementById('lowBtn').onclick = () => { sideLow = true; updateUI(); };
        document.getElementById('highBtn').onclick = () => { sideLow = false; updateUI(); };
        
        function updateUI() {
            document.getElementById('lowBtn').className = sideLow ? "side-btn selected" : "side-btn";
            document.getElementById('highBtn').className = !sideLow ? "side-btn selected" : "side-btn";
        }

        async function sendBet() {
            if (!tonConnectUI.connected) {
                alert("Please connect your wallet first!");
                return;
            }

            try {
                const amount = document.getElementById('betAmount').value;
                const cell = new TonWeb.boc.Cell();
                
                // 1. Opcode (0xAAAABBBB)
                cell.bits.writeUint(0xAAAABBBB, 32);
                // 2. sideLow (Bool)
                cell.bits.writeBit(sideLow);
                // 3. Referrer (Maybe Address) - Setting to '0' (None) to avoid encoding errors for now
                cell.bits.writeBit(false); 

                const bocBase64 = TonWeb.utils.bytesToBase64(await cell.toBoc());

                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 360,
                    messages: [{
                        address: CONTRACT_ADDR,
                        amount: TonWeb.utils.toNano(amount).toString(),
                        payload: bocBase64
                    }]
                };

                await tonConnectUI.sendTransaction(transaction);
                alert("Transaction sent to wallet!");
            } catch (e) {
                console.error(e);
                alert("Error: " + e.message);
            }
        }

        document.getElementById('betBtn').onclick = sendBet;
    </script>
</body>
</html>
