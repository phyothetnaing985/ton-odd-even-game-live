<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN GAME</title>

<script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #0b1220;
    color: white;
    text-align: center;
}
.container {
    max-width: 400px;
    margin: auto;
    padding: 20px;
}
.card {
    background: #1c2a3a;
    padding: 20px;
    border-radius: 12px;
}
input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}
.green { background: #22c55e; color: white; }
.yellow { border: 2px solid gold; }
.gray { background: #334155; color: white; }
</style>
</head>

<body>

<div class="container">

<h2>🎲 GOLDEN GAME</h2>

<div id="wallet"></div>

<div class="card">
    <h3>Bet Amount</h3>
    <input id="amount" value="0.2">

    <h3>Choose Side</h3>
    <button id="lowBtn" class="yellow">LOW (1-49)</button>
    <button id="highBtn" class="gray">HIGH (50-98)</button>

    <button class="green" onclick="placeBet()">PLACE BET</button>
</div>

</div>

<script type="module">

import { beginCell, toNano } from "https://esm.sh/@ton/core";

const CONTRACT = "EQDRvvRCW_E_Qr8IEZLpR8L4LxD-w0Ar_8vkV6tB09AsvKOI";

let sideLow = true;

// UI toggle
document.getElementById("lowBtn").onclick = () => {
    sideLow = true;
};
document.getElementById("highBtn").onclick = () => {
    sideLow = false;
};

// TonConnect init
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
    buttonRootId: "wallet"
});

window.placeBet = async () => {
    try {

        const bet = document.getElementById("amount").value;

        // 🔥 BUILD PAYLOAD (CORRECT FORMAT)
        const cell = beginCell()
            .storeUint(0xAAAABBBB, 32) // opcode
            .storeBit(sideLow)         // sideLow
            .storeBit(0)               // ❗ referrer = NONE
            .endCell();

        const boc = cell.toBoc();
        const base64 = btoa(
            String.fromCharCode(...new Uint8Array(boc))
        );

        const tx = {
            validUntil: Math.floor(Date.now() / 1000) + 360,
            messages: [
                {
                    address: CONTRACT,
                    amount: toNano(bet).toString(),
                    payload: base64
                }
            ]
        };

        console.log("TX:", tx);

        // 🚀 SEND TRANSACTION
        await tonConnectUI.sendTransaction(tx);

    } catch (e) {
        console.error(e);
        alert("Transaction Failed: " + e.message);
    }
};

</script>

</body>
</html>
