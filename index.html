<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOLDEN GAME V2 FINAL</title>

<script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>

<style>
body { background:#0f172a; color:white; font-family:Arial; text-align:center; }
.card { background:#1e293b; padding:20px; border-radius:15px; max-width:420px; margin:auto; }
.gold { color:#f1c40f; font-size:26px; }
button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:10px; }
.green{background:#2ecc71;} .blue{background:#3498db;}
</style>
</head>

<body>

<h2>🎰 GOLDEN GAME</h2>
<div id="wallet"></div>

<div class="card">

<div class="gold">Pending: <span id="pending">0</span> TON</div>
<div>Referral: <span id="refBal">0</span> TON</div>

<input id="amount" value="0.2">

<button onclick="placeBet()" class="green">BET</button>
<button onclick="claimWin()" class="blue">CLAIM</button>

</div>

<script>

const CONTRACT = "EQCvX-jYteyWju6LGfig1MWEGjU9PVBxDErJBdd8LEzVRxiI";

let userAddress = null;
let sideLow = true;

const tonweb = new TonWeb(new TonWeb.HttpProvider("https://toncenter.com/api/v2/jsonRPC"));

const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
 manifestUrl: "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json",
 buttonRootId: "wallet"
});

// CONNECT
tonConnectUI.onStatusChange(wallet => {
 if(wallet){
   userAddress = wallet.account.address;
   loadAll();
 }
});

// ✅ CORE FIX FUNCTION
async function callGetter(method){

 const addr = new TonWeb.utils.Address(userAddress);

 const cell = new TonWeb.boc.Cell();
 cell.bits.writeAddress(addr);

 const slice = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

 const res = await tonweb.provider.call2(
   CONTRACT,
   method,
   [["tvm.Slice", slice]]
 );

 // 🔥 FIX HERE
 return res.stack[0][1];
}

// ✅ LOAD ALL BALANCES
async function loadAll(){
 try{
   const winNano = await callGetter("pendingWin");
   const refNano = await callGetter("referralBalance");

   document.getElementById("pending").innerText =
     TonWeb.utils.fromNano(winNano);

   document.getElementById("refBal").innerText =
     TonWeb.utils.fromNano(refNano);

 }catch(e){
   console.error(e);
 }
}

// BET
async function placeBet(){

 const bet = document.getElementById("amount").value;

 const amount = TonWeb.utils.toNano(bet)
  .add(TonWeb.utils.toNano("0.05"));

 const cell = new TonWeb.boc.Cell();
 cell.bits.writeUint(0xAAAABBBB,32);
 cell.bits.writeBit(sideLow);
 cell.bits.writeAddress(null);

 const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

 await tonConnectUI.sendTransaction({
   validUntil: Math.floor(Date.now()/1000)+300,
   messages:[{
     address: CONTRACT,
     amount: amount.toString(),
     payload: payload
   }]
 });

 setTimeout(loadAll,5000);
}

// CLAIM
async function claimWin(){

 const cell = new TonWeb.boc.Cell();
 cell.bits.writeUint(0,32);
 cell.bits.writeString("Claim");

 const payload = TonWeb.utils.bytesToBase64(await cell.toBoc(false));

 await tonConnectUI.sendTransaction({
   validUntil: Math.floor(Date.now()/1000)+300,
   messages:[{
     address: CONTRACT,
     amount: TonWeb.utils.toNano("0.05").toString(),
     payload: payload
   }]
 });

 document.getElementById("pending").innerText="0";

 setTimeout(loadAll,5000);
}

// AUTO REFRESH
setInterval(loadAll,5000);

</script>

</body>
</html>
