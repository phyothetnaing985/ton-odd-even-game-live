<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Connection Test</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <style>
        body { 
            background: #0b0e11; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif;
        }
        .header { margin-bottom: 20px; font-weight: bold; color: #f3ba2f; }
        /* ခလုတ်နေရာလွတ် */
        #ton-connect-btn { margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">GOLDEN LOW-HIGH WALLET TEST</div>
    
    <div id="ton-connect-btn"></div>

    <script>
        async function init() {
            try {
                // အရှင်မင်းကြီး၏ Static URL ကို တိုက်ရိုက် သတ်မှတ်ခြင်း
                const manifest = "https://phyothetnaing985.github.io/ton-odd-even-game-live/tonconnect-manifest.json";
                
                const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: manifest,
                    buttonRootId: 'ton-connect-btn'
                });

                console.log("TonConnect Initialized Successfully");
            } catch (e) {
                console.error("Initialization Failed:", e);
                alert("Connect Wallet Error: " + e.message);
            }
        }

        // စာမျက်နှာပွင့်သည်နှင့် စတင်ခိုင်းခြင်း
        init();
    </script>
</body>
</html>
